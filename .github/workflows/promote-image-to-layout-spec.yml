name: Promote image-to-layout-spec

on:
  push:
    branches: [feat/image-to-layout-spec]
    paths:
      - .github/workflows/promote-image-to-layout-spec.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/image-to-layout-spec
          fetch-depth: 0
      - name: Fetch pinned tested skill
        shell: bash
        run: |
          set -euo pipefail
          SRC_SHA=de0be5a62f3f2717b37779ed014d77afaaf490e2
          curl -fsSL "https://github.com/teplovik/agent-settlements-1c/archive/${SRC_SHA}.tar.gz" -o /tmp/src.tar.gz
          rm -rf /tmp/src
          mkdir -p /tmp/src
          tar -xzf /tmp/src.tar.gz -C /tmp/src --strip-components=1
          SRC=/tmp/src/.cursor/skills/image-to-layout-spec
          DST=.claude/skills/image-to-layout-spec
          test -f "$SRC/SKILL.md"
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -a "$SRC"/. "$DST"/
          # Canonical library copy: remove temporary-workspace wording only.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.claude/skills/image-to-layout-spec/SKILL.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('> **Temporary workspace mirror** of the intended `teplovik/cc-1c-skills` skill.\n> Develop/review here; promote back to `cc-1c-skills` as SoT when accepted.\n> Phase 1 implemented in this tree (deterministic core). Heavy OCR/ML remains optional.\n\n','> **Canonical skill source (SoT) in `teplovik/cc-1c-skills`.**\n> Phase 1 is implemented and tested. Heavy OCR/ML remains optional.\n\n')
          s=s.replace('Package layout (this mirror):','Package layout:')
          s=s.replace('This tree is a temporary mirror only.','This directory is the canonical reusable skill source.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Test promoted skill
        shell: bash
        run: |
          set -euo pipefail
          cd .claude/skills/image-to-layout-spec
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m unittest discover -s tests -v
          python3 scripts/run_layout_spec.py --help >/dev/null
      - name: Commit promoted implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/image-to-layout-spec
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: promote tested image-to-layout-spec phase1"
          git push origin HEAD:feat/image-to-layout-spec
